<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes · Connexion</title><style>body{background:#0b1218;color:#edf3f5;font:16px/1.6 system-ui;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;box-sizing:border-box}.card{max-width:420px;padding:36px;background:#121e27;border:1px solid #273743;border-radius:16px}h1{font-size:30px;margin:8px 0}p,label{color:#9aadb9}input,button{box-sizing:border-box;width:100%;font:inherit;padding:13px;border-radius:8px;margin-top:10px}input{background:#0b151d;color:white;border:1px solid #39505e}button{background:#62d8c7;border:0;color:#09231f;font-weight:700;cursor:pointer}.over{color:#62d8c7;font-size:11px;letter-spacing:2px}#err{color:#fb979e}small{color:#9aadb9}</style><div class="card"><div class="over">HERMES / TRADING CONNECT 0.2</div><h1>Ton espace de recherche.</h1><p>Journal, outils quantitatifs et connexions. Aucun ordre broker depuis cette interface.</p><form id="f"><label>Clé d’accès de l’application<input id="token" type="password" required autocomplete="current-password"></label><button>Ouvrir mon espace</button></form><p id="err" role="alert"></p><small>Utilise la clé configurée dans PROP_ADMIN_TOKEN. Ne la partage pas dans le chat.</small></div><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.getElementById('token').value})});const j=await r.json();if(!r.ok)throw Error(j.error);location.reload()}catch(e){err.textContent=e.message}}</script></html>
